<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會議籌備詳細流程</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">

    <div class="max-w-4xl mx-auto p-6">
        <div class="mb-6">
            <a href="index.html" class="text-blue-600 hover:underline">&larr; 返回會議列表</a>
        </div>

        <header class="bg-white p-6 rounded-xl shadow-md mb-6">
            <h1 id="detail-title" class="text-3xl font-bold text-gray-900 mb-2">載入中...</h1>
            <p id="detail-date" class="text-gray-600 mb-4"></p>
            
            <!-- 進度條 -->
            <div>
                <div class="flex justify-between text-sm font-medium text-gray-700 mb-1">
                    <span>整體籌備進度</span>
                    <span id="detail-progress-text">0%</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-3">
                    <div id="detail-progress-bar" class="bg-blue-600 h-3 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>
        </header>

        <!-- 新增待辦事項 -->
        <section class="bg-white p-6 rounded-xl shadow-md mb-6">
            <h2 class="text-xl font-semibold mb-4">新增籌備工作項目</h2>
            <form id="add-task-form" class="flex gap-4">
                <input type="text" id="task-name" placeholder="例如：審稿委員會組成、場地確認..." required class="flex-1 border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                <button type="submit" class="bg-green-600 hover:bg-green-700 text-white font-medium py-2 px-6 rounded-lg transition">
                    新增工作
                </button>
            </form>
        </section>

        <!-- 任務清單 -->
        <section class="bg-white p-6 rounded-xl shadow-md">
            <h2 class="text-xl font-semibold mb-4">工作清單</h2>
            <ul id="task-list" class="divide-y divide-gray-200">
                <p class="text-gray-500">尚無工作項目</p>
            </ul>
        </section>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
