<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學術會議籌備管理系統</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- 主系統內容容器 (直接顯示) -->
    <div id="main-app" class="max-w-4xl mx-auto p-4 sm:p-6">
        <header class="mb-6 sm:mb-8 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <h1 class="text-2xl sm:text-3xl font-bold text-blue-600">學術會議籌備管理</h1>
            <div class="flex items-center gap-3">
                <span id="sync-status" class="text-sm text-gray-500">連線中...</span>
            </div>
        </header>

        <!-- 新增/編輯活動表單 -->
        <section class="bg-white p-4 sm:p-6 rounded-xl shadow-md mb-8">
            <h2 id="form-title" class="text-lg sm:text-xl font-semibold mb-4">新增學術會議</h2>
            <form id="add-event-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="hidden" id="event-id">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">活動中文名稱 <span class="text-gray-400 text-xs">(中英擇一必填)</span></label>
                    <input type="text" id="event-name-zh" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm sm:text-base focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">活動英文名稱 <span class="text-gray-400 text-xs">(中英擇一必填)</span></label>
                    <input type="text" id="event-name-en" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm sm:text-base focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">會議日期 <span class="text-red-500">*</span></label>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        <input type="date" id="event-start-date" required class="w-full border border-gray-300 rounded-lg p-2.5 text-sm sm:text-base focus:ring-2 focus:ring-blue-500 focus:outline-none" title="開始日期">
                        <input type="date" id="event-end-date" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm sm:text-base focus:ring-2 focus:ring-blue-500 focus:outline-none" title="結束日期 (若為單日可不填)">
                    </div>
                    <span class="text-gray-400 text-xs mt-1 block">若為多日會議請填寫起訖日，單日僅填左側即可</span>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">學術負責人 <span class="text-gray-400 text-xs">(選填)</span></label>
                    <input type="text" id="event-academic-lead" placeholder="例如：張教授" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm sm:text-base focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">行政負責人 <span class="text-gray-400 text-xs">(選填)</span></label>
                    <input type="text" id="event-admin-lead" placeholder="例如：李專員" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm sm:text-base focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">負責部門 <span class="text-gray-400 text-xs">(選填)</span></label>
                    <input type="text" id="event-department" placeholder="例如：計算機科學與工程學院" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm sm:text-base focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">會議地點 <span class="text-gray-400 text-xs">(選填)</span></label>
                    <input type="text" id="event-location" placeholder="例如：澳科N101" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm sm:text-base focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div class="md:col-span-2 flex flex-col sm:flex-row gap-2 pt-2">
                    <button type="submit" id="submit-btn" class="w-full sm:flex-1 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-4 rounded-lg transition text-sm sm:text-base">
                        新增活動
                    </button>
                    <button type="button" id="cancel-edit-btn" class="hidden w-full sm:w-auto bg-gray-300 hover:bg-gray-400 text-gray-700 font-medium py-2.5 px-4 rounded-lg transition text-sm sm:text-base">
                        取消編輯
                    </button>
                </div>
            </form>
        </section>

        <!-- 活動列表 -->
        <section>
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-3">
                <h2 class="text-lg sm:text-xl font-semibold">現有會議列表</h2>
                <div class="flex flex-wrap items-center gap-2 w-full sm:w-auto justify-between sm:justify-end">
                    <!-- 導出 CSV 按鈕 -->
                    <button type="button" id="export-csv-btn" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs sm:text-sm font-medium px-3.5 py-2 rounded-lg transition flex items-center gap-1.5 shadow-sm">
                        📥 導出 CSV
                    </button>
                    <div class="flex items-center gap-2">
                        <label for="sort-order" class="text-xs sm:text-sm text-gray-600 font-medium whitespace-nowrap">排序：</label>
                        <select id="sort-order" class="border border-gray-300 rounded-lg px-2.5 py-1.5 text-xs sm:text-sm bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <option value="asc">日期由近到遠</option>
                            <option value="desc">日期由遠到近</option>
                        </select>
                    </div>
                </div>
            </div>
            <div id="event-list" class="flex flex-col gap-3">
                <!-- 動態載入會議列表 -->
                <p class="text-gray-500 text-sm">載入中...</p>
            </div>
        </section>
    </div>

    <!-- 內嵌 Firebase 與頁面邏輯 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, update, remove, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBnwMcgxCxqyQi4n7dc4-ZRZGiFT0dVUFg",
            authDomain: "conference-c7eee.firebaseapp.com",
            databaseURL: "https://conference-c7eee-default-rtdb.asia-southeast1.firebasedatabase.app/",
            projectId: "conference-c7eee",
            storageBucket: "conference-c7eee.firebasestorage.app",
            messagingSenderId: "603047083531",
            appId: "1:603047083531:web:909351d3140b2b040f110e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // DOM 元素
        const exportCsvBtn = document.getElementById("export-csv-btn");
        const form = document.getElementById("add-event-form");
        const eventListEl = document.getElementById("event-list");
        const syncStatus = document.getElementById("sync-status");
        const formTitle = document.getElementById("form-title");
        const submitBtn = document.getElementById("submit-btn");
        const cancelEditBtn = document.getElementById("cancel-edit-btn");
        const eventIdInput = document.getElementById("event-id");
        const sortOrderSelect = document.getElementById("sort-order");

        syncStatus.textContent = "已連線同步";
        syncStatus.className = "text-sm text-green-600 font-medium";

        // 提交表單（包含新增與更新邏輯）
        form.addEventListener("submit", (e) => {
            e.preventDefault();
            const id = eventIdInput.value;
            const nameZh = document.getElementById("event-name-zh").value.trim();
            const nameEn = document.getElementById("event-name-en").value.trim();

            if (!nameZh && !nameEn) {
                alert("請至少填寫「活動中文名稱」或「活動英文名稱」其中一項！");
                return;
            }

            let name = "";
            if (nameZh && nameEn) {
                name = `${nameZh} (${nameEn})`;
            } else {
                name = nameZh || nameEn;
            }

            const startDate = document.getElementById("event-start-date").value;
            const endDate = document.getElementById("event-end-date").value;
            const academicLead = document.getElementById("event-academic-lead").value;
            const adminLead = document.getElementById("event-admin-lead").value;
            const department = document.getElementById("event-department").value;
            const location = document.getElementById("event-location").value;

            let dateDisplay = startDate;
            if (endDate && endDate >= startDate) {
                dateDisplay = `${startDate} ~ ${endDate}`;
            }

            const eventData = {
                name: name,
                date: dateDisplay,
                startDate: startDate,
                endDate: endDate || "",
                academicLead: academicLead || "",
                adminLead: adminLead || "",
                department: department || "",
                location: location || ""
            };

            if (id) {
                const eventRef = ref(db, `events/${id}`);
                update(eventRef, eventData).then(() => {
                    resetForm();
                }).catch((error) => {
                    alert("更新失敗：" + error.message);
                });
            } else {
                const eventsRef = ref(db, 'events');
                push(eventsRef, eventData).then(() => {
                    form.reset();
                }).catch((error) => {
                    alert("新增失敗：" + error.message);
                });
            }
        });

        cancelEditBtn.addEventListener("click", () => {
            resetForm();
        });

        sortOrderSelect.addEventListener("change", () => {
            if (window.lastEventData) {
                renderEventList(window.lastEventData);
            }
        });

        function resetForm() {
            form.reset();
            eventIdInput.value = "";
            formTitle.textContent = "新增學術會議";
            submitBtn.textContent = "新增活動";
            submitBtn.className = "w-full sm:flex-1 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-4 rounded-lg transition text-sm sm:text-base";
            cancelEditBtn.classList.add("hidden");
        }

        const eventsRef = ref(db, 'events');
        onValue(eventsRef, (snapshot) => {
            const data = snapshot.val();
            window.lastEventData = data;
            renderEventList(data);
        }, (error) => {
            console.error(error);
            eventListEl.innerHTML = `<p class="text-red-500 text-sm">讀取資料失敗，請確認 Firebase Rules 權限與連線設定。</p>`;
        });

        // 導出 CSV 功能
        exportCsvBtn.addEventListener("click", () => {
            const data = window.lastEventData;
            if (!data) {
                alert("目前沒有可導出的會議資料！");
                return;
            }

            let csvContent = "\uFEFF"; 
            csvContent += "會議名稱,日期,負責部門,會議地點,學術負責人,行政負責人,進度百分比\n";

            Object.keys(data).forEach((key) => {
                const event = data[key];
                const tasks = event.tasks ? Object.values(event.tasks) : [];
                const totalTasks = tasks.length;
                const completedTasks = tasks.filter(t => t.completed).length;
                const progress = totalTasks > 0 ? Math.round((completedTasks / totalTasks) * 100) : 0;

                const name = `"${(event.name || "").replace(/"/g, '""')}"`;
                const date = `"${(event.date || "").replace(/"/g, '""')}"`;
                const department = `"${(event.department || "未填寫").replace(/"/g, '""')}"`;
                const location = `"${(event.location || "未填寫").replace(/"/g, '""')}"`;
                const academicLead = `"${(event.academicLead || "未填寫").replace(/"/g, '""')}"`;
                const adminLead = `"${(event.adminLead || "未填寫").replace(/"/g, '""')}"`;
                const progressStr = `"${progress}%"`;

                csvContent += `${name},${date},${department},${location},${academicLead},${adminLead},${progressStr}\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.setAttribute("href", url);
            a.setAttribute("download", `academic_conferences_${new Date().toISOString().slice(0, 10)}.csv`);
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        });

        function renderEventList(data) {
            eventListEl.innerHTML = "";

            if (!data) {
                eventListEl.innerHTML = `<p class="text-gray-500 text-sm">目前沒有會議，請在上方新增。</p>`;
                return;
            }

            const sortOrder = sortOrderSelect.value;
            const eventKeys = Object.keys(data);
            
            eventKeys.sort((a, b) => {
                const dateA = data[a].startDate || data[a].date || "";
                const dateB = data[b].startDate || data[b].date || "";
                if (sortOrder === "asc") {
                    return dateA.localeCompare(dateB);
                } else {
                    return dateB.localeCompare(dateA);
                }
            });

            eventKeys.forEach((key) => {
                const event = data[key];
                
                // 修正：確實從資料中計算子任務進度
                const tasks = event.tasks ? Object.values(event.tasks) : [];
                const totalTasks = tasks.length;
                const completedTasks = tasks.filter(t => t.completed).length;
                const progress = totalTasks > 0 ? Math.round((completedTasks / totalTasks) * 100) : 0;

                const item = document.createElement("div");
                item.className = "bg-white p-4 sm:p-5 rounded-xl shadow-sm border border-gray-200 hover:shadow-md transition flex flex-col md:flex-row justify-between items-start md:items-center gap-4";
                
                const departmentHtml = event.department 
                    ? `<span class="inline-flex items-center text-gray-800 bg-gray-100 px-2.5 py-1 rounded-md text-xs sm:text-sm font-medium border border-gray-200">🏢 部門：${escapeHtml(event.department)}</span>` 
                    : `<span class="inline-flex items-center text-gray-400 bg-gray-50 px-2.5 py-1 rounded-md text-xs sm:text-sm font-medium border border-dashed border-gray-200">🏢 部門：未填寫</span>`;

                const locationHtml = event.location 
                    ? `<span class="inline-flex items-center text-gray-800 bg-blue-50 px-2.5 py-1 rounded-md text-xs sm:text-sm font-medium border border-blue-100">📍 地點：${escapeHtml(event.location)}</span>` 
                    : `<span class="inline-flex items-center text-gray-400 bg-gray-50 px-2.5 py-1 rounded-md text-xs sm:text-sm font-medium border border-dashed border-gray-200">📍 地點：未填寫</span>`;
                
                const academicHtml = event.academicLead 
                    ? `<span class="inline-flex items-center text-gray-800 bg-indigo-50 px-2.5 py-1 rounded-md text-xs sm:text-sm font-medium border border-indigo-100">🎓 學術：${escapeHtml(event.academicLead)}</span>` 
                    : `<span class="inline-flex items-center text-gray-400 bg-gray-50 px-2.5 py-1 rounded-md text-xs sm:text-sm font-medium border border-dashed border-gray-200">🎓 學術：未填寫</span>`;
                
                const adminHtml = event.adminLead 
                    ? `<span class="inline-flex items-center text-gray-800 bg-emerald-50 px-2.5 py-1 rounded-md text-xs sm:text-sm font-medium border border-emerald-100">📋 行政：${escapeHtml(event.adminLead)}</span>` 
                    : `<span class="inline-flex items-center text-gray-400 bg-gray-50 px-2.5 py-1 rounded-md text-xs sm:text-sm font-medium border border-dashed border-gray-200">📋 行政：未填寫</span>`;

                item.innerHTML = `
                    <div class="flex-1 cursor-pointer w-full" data-detail-id="${key}">
                        <div class="flex flex-wrap items-center gap-2 mb-2 sm:mb-3">
                            <h3 class="text-base sm:text-lg font-bold text-gray-800">${escapeHtml(event.name)}</h3>
                            <span class="text-xs bg-blue-50 text-blue-600 px-2.5 py-0.5 sm:py-1 rounded-full font-semibold border border-blue-100">📅 ${event.date}</span>
                        </div>
                        <div class="flex flex-wrap gap-2">
                            ${departmentHtml}
                            ${locationHtml}
                            ${academicHtml}
                            ${adminHtml}
                        </div>
                    </div>
                    <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-4 w-full md:w-auto justify-between border-t md:border-t-0 pt-3 md:pt-0 border-gray-100">
                        <div class="w-full sm:w-28">
                            <div class="flex justify-between text-xs font-medium text-gray-600 mb-1">
                                <span>進度</span>
                                <span>${progress}%</span>
                            </div>
                            <div class="w-full bg-gray-200 rounded-full h-2">
                                <div class="bg-blue-600 h-2 rounded-full transition-all duration-300" style="width: ${progress}%"></div>
                            </div>
                        </div>
                        <div class="flex items-center justify-end gap-2">
                            <button type="button" class="edit-btn px-3 py-1.5 bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs sm:text-sm font-medium rounded-lg transition">
                                編輯
                            </button>
                            <button type="button" class="detail-btn px-3 py-1.5 bg-blue-50 hover:bg-blue-100 text-blue-600 text-xs sm:text-sm font-medium rounded-lg transition" data-detail-id="${key}">
                                詳細
                            </button>
                            <button type="button" class="delete-btn px-3 py-1.5 bg-red-50 hover:bg-red-100 text-red-600 text-xs sm:text-sm font-medium rounded-lg transition">
                                刪除
                            </button>
                        </div>
                    </div>
                `;

                // 編輯按鈕事件
                item.querySelector(".edit-btn").addEventListener("click", (e) => {
                    e.stopPropagation();
                    eventIdInput.value = key;
                    document.getElementById("event-name-zh").value = event.name || "";
                    document.getElementById("event-name-en").value = "";
                    document.getElementById("event-start-date").value = event.startDate || (event.date && !event.date.includes("~") ? event.date : "") || "";
                    document.getElementById("event-end-date").value = event.endDate || "";
                    document.getElementById("event-academic-lead").value = event.academicLead || "";
                    document.getElementById("event-admin-lead").value = event.adminLead || "";
                    document.getElementById("event-department").value = event.department || "";
                    document.getElementById("event-location").value = event.location || "";

                    formTitle.textContent = "編輯學術會議";
                    submitBtn.textContent = "更新活動";
                    submitBtn.className = "w-full sm:flex-1 bg-green-600 hover:bg-green-700 text-white font-medium py-2.5 px-4 rounded-lg transition text-sm sm:text-base";
                    cancelEditBtn.classList.remove("hidden");
                    
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });

                // 刪除按鈕事件
                item.querySelector(".delete-btn").addEventListener("click", (e) => {
                    e.stopPropagation();
                    if (confirm(`確定要刪除會議「${event.name}」嗎？此動作無法復原。`)) {
                        const eventRef = ref(db, `events/${key}`);
                        remove(eventRef).catch((error) => {
                            alert("刪除失敗：" + error.message);
                        });
                    }
                });

                // 點擊進入詳細頁面
                item.querySelectorAll("[data-detail-id]").forEach(el => {
                    el.addEventListener("click", () => {
                        window.location.href = `detail.html?id=${key}&name=${encodeURIComponent(event.name)}`;
                    });
                });

                eventListEl.appendChild(item);
            });
        }

        function escapeHtml(text) {
            if (!text) return '';
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>
</body>
</html>
