<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學術會議籌備管理系統</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">

    <div class="max-w-4xl mx-auto p-6">
        <header class="mb-8 flex justify-between items-center">
            <h1 class="text-3xl font-bold text-blue-600">學術會議籌備管理</h1>
            <span id="sync-status" class="text-sm text-gray-500">連線中...</span>
        </header>

        <!-- 新增活動表單 -->
        <section class="bg-white p-6 rounded-xl shadow-md mb-8">
            <h2 class="text-xl font-semibold mb-4">新增學術會議</h2>
            <form id="add-event-form" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">活動名稱</label>
                    <input type="text" id="event-name" required class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">會議日期</label>
                    <input type="date" id="event-date" required class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div class="flex items-end">
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition">
                        新增活動
                    </button>
                </div>
            </form>
        </section>

        <!-- 活動列表 -->
        <section>
            <h2 class="text-xl font-semibold mb-4">現有會議列表</h2>
            <div id="event-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- 動態載入活動卡片 -->
                <p class="text-gray-500">載入中...</p>
            </div>
        </section>
    </div>

    <!-- 引入 Firebase 邏輯 -->
    <script type="module" src="app.js"></script>
</body>
</html>
